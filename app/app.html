<div class="app-container" [class.is-coming-soon]="siteMode() === 'coming-soon'">
  <div class="app-content" [class.is-coming-soon]="siteMode() === 'coming-soon'">
    @if (siteMode() === 'coming-soon') {
      <app-coming-soon></app-coming-soon>
    } @else {
      <router-outlet></router-outlet>
    }
  </div>
</div>
